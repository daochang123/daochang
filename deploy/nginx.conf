# AI主理·道场看板 部署配置（Nginx）
# 用途：把 /workspace/daochang 静态目录挂载到公网，手机浏览器直接访问。
#
# 放置：
#   - 将本文件复制到服务器：/etc/nginx/conf.d/daochang.conf
#   - 把看板目录（index.html + data/ + 依赖）放到 /var/www/daochang/
#   - 然后：sudo nginx -t && sudo systemctl reload nginx
#   - 配 HTTPS 用 certbot：sudo certbot --nginx -d daochang.example.com
#
server {
    listen 80;
    listen 443 ssl;
    server_name daochang.example.com;          # 改成你的域名或服务器IP

    # HTTPS（certbot 会自动补全这两行）
    # ssl_certificate     /etc/letsencrypt/live/daochang.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/daochang.example.com/privkey.pem;

    root /var/www/daochang;
    index index.html;

    # 移动端 viewport：index.html 已带 <meta name="viewport">，无需额外处理

    # 看板实时快照 + 历史快照（定时任务每小时写入 data/）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # data/ 目录允许较长缓存（快照文件会带时间戳/版本）
    location /data/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # 健康检查
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # 基础安全
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    access_log /var/log/nginx/daochang.access.log;
    error_log  /var/log/nginx/daochang.error.log;
}
